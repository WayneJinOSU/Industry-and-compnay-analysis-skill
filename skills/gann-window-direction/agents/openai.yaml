interface:
  display_name: "江恩窗口方向选择"
  short_description: "基于点时数据、江恩波浪、结构位和内外部确认，生成中文条件路径、可门禁、可复盘的指数研判报告"
  default_prompt: "执行江恩窗口方向选择：先冻结目标日与点时截点，读取或生成江恩与波浪上游，构建可验证的外盘与关键位输入，生成上一份防线到本日的破位与收复记忆，并统一以 Wilder 14 平均真实波幅生成当前点位锚和无权重收盘分箱。代码只计算事实、点位、执行风险事实并执行校验，不生成评分、风险状态、操作动作或操作理由；大模型读取全部点时证据后，独立裁决中期结构、窗口状态、次日基准路径、风险状态和执行动作。次日路径必须给出开盘点位区间、至少2个有序盘中观察节点和收盘点位区间，以及向上切换、向下切换、独立尾部风险和基准路径失效；不得生成四情景权重、数值置信度、权重领先幅度、低确信标签或事件日总方向。中期结构与次日收盘强弱冲突时必须解释趋势分歧。每一项大模型操作建议都必须同时说明建议动作、至少2条支持理由、最强反方证据、动作维持条件、动作解除条件、适用期限和复查时点。盘前五项风险事实使用成立、不成立、未知三值，未知保留为数据缺口，不评分、不映射动作；外部极端状态必须同时处理正向亢奋和经亚洲确认的负向冲击。报告分开披露执行风险事实与大模型执行裁量。价格、百分比、日期、周期、金额、倍数和版本号必须使用阿拉伯数字。机器标识仅保留在结构化数据、门禁和路径结算记录中。结果按阶段冻结并通过预检和终检。"
