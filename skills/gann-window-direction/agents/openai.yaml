interface:
  display_name: "江恩窗口方向选择"
  short_description: "基于点时数据、江恩波浪、结构位和内外部确认，生成中文情景表、可门禁、可复盘的指数方向报告"
  default_prompt: "执行江恩窗口方向选择：先冻结目标日与点时截点，读取或生成江恩与波浪上游，构建可验证的外盘与关键位输入，计算状态与条件基率，再输出连续四情景、执行姿态、防守触发、恢复进攻触发和覆盖失效。每一项操作建议都必须同时说明建议动作、至少两条支持理由、最强反方证据、动作维持条件、动作解除条件、适用期限和复查时点。盘前六项检查使用成立、不成立、未知三值，未知不计分。报告信息表、决策卡、执行覆盖和所有结论必须把字段名与状态值全部翻译成中文，并按字段翻译状态；价格、百分比、日期、周期、金额、倍数和版本号必须使用阿拉伯数字。机器标识仅保留在结构化数据、门禁和评分记录中。结果按阶段冻结并通过预检和终检。"
