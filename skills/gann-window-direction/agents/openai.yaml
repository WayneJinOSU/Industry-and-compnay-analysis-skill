interface:
  display_name: "江恩窗口方向选择"
  short_description: "基于点时数据、江恩波浪、结构位和内外部确认，生成中文情景表、可门禁、可复盘的指数方向报告"
  default_prompt: "执行江恩窗口方向选择：先冻结目标日与点时截点，读取或生成江恩与波浪上游，构建可验证的外盘与关键位输入，生成上一份防线到本日的破位与收复记忆。代码只产生基线权重和风险参考，大模型必须读取全部点时证据后完成综合研判，最终决定四情景权重、主方向、执行动作和操作建议。主方向只允许看多、看空、震荡三种；向下延续固定看空，区间震荡固定震荡，向上突破固定看多，尾部极值向下固定看空。每一项操作建议都必须同时说明建议动作、至少两条支持理由、最强反方证据、动作维持条件、动作解除条件、适用期限和复查时点。盘前六项检查使用成立、不成立、未知三值，未知不计分；外部极端状态必须同时处理正向亢奋和经亚洲确认的负向冲击；最高两项权重差不足5个百分点时标记低确信。价格、百分比、日期、周期、金额、倍数和版本号必须使用阿拉伯数字。机器标识仅保留在结构化数据、门禁和评分记录中。结果按阶段冻结并通过预检和终检。"
